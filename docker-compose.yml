services:
  scores:
    build: .
    container_name: score_server
    environment:
      PORT: "8091"
      DB_PATH: /data/scores.db
      # Optional: a Google service account key (JSON) with access to the
      # apps in the Play Console turns on Google Play purchase checks.
      GOOGLE_SERVICE_ACCOUNT_FILE: /data/google-service-account.json
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Purchase refusals log player ids; keep at most ~30 MB of logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Nginx server block for the leaderboard service. Two options:
#
# A) Subdomain (recommended): replace scores.example.com below, put
#    this file in /etc/nginx/sites-available/, symlink into
#    sites-enabled, run certbot --nginx -d scores.example.com, reload.
#
# B) Path on the existing domain: instead of this file, add the
#    `location /lb/` block to the existing server block and strip the
#    prefix with `rewrite ^/lb/(.*)$ /$1 break;` (the HMAC signature
#    covers the path the app sees, so the strip must happen before
#    proxying).

server {
    listen 80;
    server_name scores.example.com;

    # Basic abuse damping; the service itself is cheap to hit.
    limit_req_zone $binary_remote_addr zone=scores:10m rate=10r/s;

    location / {
        limit_req zone=scores burst=20 nodelay;

        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
